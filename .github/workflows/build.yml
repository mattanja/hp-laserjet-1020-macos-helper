name: Build macOS app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: codesign --verify --deep --strict --verbose=2 "build/Prepare HP LaserJet.app"
